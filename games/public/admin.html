<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#F3EDE3" />
<title>Admin · Play</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/home.css?v=1" />
<style>
  /* Dashboard-only styles. Palette and type come from home.css. */
  body { min-height: 100vh; }
  .wrap { max-width: 880px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 20px) 18px calc(env(safe-area-inset-bottom, 0px) + 40px); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .top a { color: var(--muted); font-size: 14px; }
  .title { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(26px, 6vw, 36px); letter-spacing: .14em; text-transform: uppercase; color: var(--green); }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: var(--shadow-lg); margin-bottom: 14px; }
  .card h2 { margin: 0 0 12px; font-family: var(--serif); font-weight: 400; font-size: 14px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .login { max-width: 360px; margin: 14vh auto 0; text-align: center; }
  .login .title { margin-bottom: 16px; }
  .login .field { margin-bottom: 12px; box-shadow: none; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; background: var(--card-2); }
  .seg button { font: inherit; font-size: 14px; min-height: 40px; padding: 0 14px; border: 0; background: none; color: var(--text); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--green); color: var(--green-ink); }
  .ghost { font: inherit; font-size: 14px; min-height: 40px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--card); color: var(--text); cursor: pointer; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow-lg); }
  .tile .n { font-family: var(--body); font-weight: 500; font-size: 34px; line-height: 1.1; color: var(--text); font-variant-numeric: tabular-nums; }
  .tile .l { margin-top: 4px; font-size: 13px; color: var(--muted); }
  .tile.warn .n { color: var(--clay); }
  svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
  .chart .gridline { stroke: rgba(74, 56, 36, .12); stroke-width: 1; }
  .chart .axis { fill: var(--muted); font: 11px var(--body); }
  .chart .val { fill: var(--text); font: 500 11px var(--body); }
  .chart rect.m { fill: var(--green); }
  .chart rect.m:hover, .chart rect.m:focus { fill: var(--green-2); outline: none; stroke: var(--gold); stroke-width: 2; }
  .chart rect.hit { fill: transparent; }
  .rows { display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 7.5em 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
  .row .name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .track { height: 12px; border-radius: 6px; background: var(--card-2); overflow: hidden; }
  .row .fill { height: 100%; border-radius: 0 6px 6px 0; background: var(--green); min-width: 2px; }
  .row .num { font-variant-numeric: tabular-nums; color: var(--text); min-width: 5.5em; text-align: right; }
  .row .num small { color: var(--muted); }
  .two { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 720px) { .two { grid-template-columns: 1fr 1fr; } }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th { font-weight: 500; color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  td.r, th.r { text-align: right; }
  #recent td, #recent th { white-space: nowrap; padding-right: 14px; }
  .scroll { overflow-x: auto; }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 6px 0; }
  .ev { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--line); }
  .ev.bad { color: var(--clay); border-color: rgba(217, 102, 58, .4); }
  .ev.good { color: var(--green); }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .note { color: var(--muted); font-size: 13px; margin-top: 4px; }
  #tip { position: fixed; z-index: 10; pointer-events: none; background: var(--green); color: var(--green-ink); font-size: 13px; padding: 6px 10px; border-radius: 8px; box-shadow: var(--shadow-lg); opacity: 0; transition: opacity .1s; max-width: 220px; }
  #tip.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #tip { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <section id="login" class="login card" hidden>
    <h1 class="title">Admin</h1>
    <form id="f" autocomplete="off">
      <input class="field" id="code" type="password" placeholder="Admin passcode" aria-label="Admin passcode"
             autocapitalize="off" autocorrect="off" spellcheck="false" required />
      <button class="btn" id="go" type="submit">Sign in</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section id="dash" hidden>
    <div class="top">
      <div>
        <h1 class="title">Usage</h1>
        <p class="sub" id="stamp">Loading</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <a href="/play">Games</a>
        <button class="ghost" id="out" type="button">Sign out</button>
      </div>
    </div>

    <div class="bar">
      <div class="seg" role="group" aria-label="Time range" id="range">
        <button type="button" data-d="7" aria-pressed="false">7 days</button>
        <button type="button" data-d="14" aria-pressed="true">14 days</button>
        <button type="button" data-d="30" aria-pressed="false">30 days</button>
        <button type="button" data-d="90" aria-pressed="false">90 days</button>
      </div>
      <button class="ghost" id="refresh" type="button">Refresh</button>
    </div>

    <div class="tiles" id="tiles"></div>

    <div class="card">
      <h2>Games opened per day</h2>
      <div id="chart"></div>
      <details>
        <summary>View as table</summary>
        <div class="scroll"><table id="dailyTable"></table></div>
      </details>
    </div>

    <div class="two">
      <div class="card"><h2>Games</h2><div class="rows" id="games"></div></div>
      <div class="card"><h2>Devices</h2><div class="rows" id="devices"></div></div>
    </div>

    <div class="card">
      <h2>Recent activity</h2>
      <div class="scroll"><table id="recent"></table></div>
      <p class="note">Visitors are anonymous random ids. No names or IP addresses are stored. Your own game opens are not counted while you are signed in here.</p>
    </div>
  </section>
</div>
<div id="tip" role="tooltip"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const NAMES = { hub: "Hub", ballast: "Ballast", yahtzee: "Yahtzee", "spite-and-malice": "Spite and Malice", uno: "Uno", catan: "Settlers of Catan",
    euchre: "Euchre", cribbage: "Cribbage", hearts: "Hearts", "gin-rummy": "Gin Rummy", backgammon: "Backgammon", bourre: "Bourré", guts: "Guts", stratego: "Stratego" };
  const EVENTS = { unlock_ok: ["Unlocked", "good"], unlock_fail: ["Wrong passcode", "bad"], open: ["Opened", ""], lock: ["Locked", ""], admin_ok: ["Admin sign-in", "good"], admin_fail: ["Admin wrong passcode", "bad"] };
  const DEVICES = { phone: "Phone", tablet: "Tablet", desktop: "Desktop", unknown: "Unknown" };
  const nf = new Intl.NumberFormat();
  let days = 14, timer = null, lastDaily = null;

  const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); Object.assign(e, props); kids.forEach((k) => e.append(k)); return e; };
  const svgEl = (tag, attrs = {}) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

  async function api(path, opts) { const r = await fetch(path, opts); return { status: r.status, json: await r.json().catch(() => ({})) }; }

  function show(authed) { $("login").hidden = authed; $("dash").hidden = !authed; if (authed) { load(); clearInterval(timer); timer = setInterval(load, 60000); } else clearInterval(timer); }

  // ---------- tooltip (hover and keyboard focus) ----------
  const tip = $("tip");
  function showTip(text, x, y) { tip.textContent = text; tip.style.left = Math.min(x + 12, innerWidth - 230) + "px"; tip.style.top = Math.max(8, y - 40) + "px"; tip.classList.add("on"); }
  const hideTip = () => tip.classList.remove("on");

  // ---------- chart ----------
  function drawDaily(daily) {
    const box = $("chart"); box.replaceChildren();
    const narrow = innerWidth < 520, W = narrow ? 340 : 640, H = narrow ? 200 : 220, L = 30, B = 26, T = 14, R = 6;
    const max = Math.max(1, ...daily.map((d) => d.plays));
    const top = Math.max(4, Math.ceil(max / 4) * 4), plotH = H - B - T, plotW = W - L - R;
    const svg = svgEl("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Games opened per day" });
    for (let i = 0; i <= 4; i++) {
      const y = T + plotH - (plotH * i) / 4;
      svg.append(svgEl("line", { class: "gridline", x1: L, x2: W - R, y1: y, y2: y }));
      const t = svgEl("text", { class: "axis", x: L - 6, y: y + 4, "text-anchor": "end" }); t.textContent = String(Math.round((top * i) / 4)); svg.append(t);
    }
    const slot = plotW / daily.length, bw = Math.max(3, Math.min(26, slot - 2));
    const every = Math.ceil(daily.length / (narrow ? 5 : 8));
    daily.forEach((d, i) => {
      const cx = L + slot * i + slot / 2, h = Math.max(d.plays ? 2 : 0, (plotH * d.plays) / top);
      const label = `${new Date(d.day + "T12:00:00Z").toLocaleDateString(undefined, { month: "short", day: "numeric", timeZone: "UTC" })}: ${d.plays} opened, ${d.unlocks} unlocks, ${d.visitors} visitors`;
      const m = svgEl("rect", { class: "m", x: cx - bw / 2, y: T + plotH - h, width: bw, height: h, rx: Math.min(4, bw / 2), tabindex: 0, "aria-label": label });
      const hit = svgEl("rect", { class: "hit", x: L + slot * i, y: T, width: slot, height: plotH });
      const on = (e) => { const r = m.getBoundingClientRect(); showTip(label, e.clientX || r.left, e.clientY || r.top); };
      [m, hit].forEach((n) => { n.addEventListener("pointermove", on); n.addEventListener("pointerenter", on); n.addEventListener("pointerleave", hideTip); });
      m.addEventListener("focus", on); m.addEventListener("blur", hideTip);
      svg.append(hit, m);
      if (d.plays) { const v = svgEl("text", { class: "val", x: cx, y: T + plotH - h - 4, "text-anchor": "middle" }); v.textContent = String(d.plays); if (daily.length <= (narrow ? 14 : 31)) svg.append(v); }
      if (i % every === 0 || (i === daily.length - 1 && i % every >= Math.ceil(every * 0.6))) {
        const a = svgEl("text", { class: "axis", x: cx, y: H - 8, "text-anchor": "middle" });
        a.textContent = new Date(d.day + "T12:00:00Z").toLocaleDateString(undefined, { month: "numeric", day: "numeric", timeZone: "UTC" }); svg.append(a);
      }
    });
    box.append(svg);
  }

  function bars(container, items, nameOf, valueKey, extra) {
    container.replaceChildren();
    if (!items.length) { container.append(el("div", { className: "empty", textContent: "Nothing yet." })); return; }
    const max = Math.max(1, ...items.map((i) => i[valueKey]));
    items.forEach((i) => {
      const fill = el("div", { className: "fill" }); fill.style.width = (100 * i[valueKey]) / max + "%";
      const num = el("div", { className: "num" }, nf.format(i[valueKey]));
      if (extra) num.append(" ", el("small", { textContent: extra(i) }));
      container.append(el("div", { className: "row" }, el("div", { className: "name", textContent: nameOf(i), title: nameOf(i) }), el("div", { className: "track" }, fill), num));
    });
  }

  function table(t, head, rows) {
    t.replaceChildren(el("thead", {}, el("tr", {}, ...head.map(([h, r]) => el("th", { className: r ? "r" : "", textContent: h })))),
      el("tbody", {}, ...rows.map((r) => el("tr", {}, ...r.map((c, i) => (c instanceof Node ? el("td", {}, c) : el("td", { className: head[i][1] ? "r" : "", textContent: c })))))));
  }

  function render(d) {
    const T = d.totals;
    $("stamp").textContent = `Last ${d.days} days. Updated ${new Date(d.generated_at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}. Days are UTC.`;
    const tiles = $("tiles"); tiles.replaceChildren();
    [["Games opened", T.plays], ["Visitors", T.visitors], ["Unlocks", T.unlocks], ["Wrong passcodes", T.fails + T.admin_fails]].forEach(([l, n], i) =>
      tiles.append(el("div", { className: "tile" + (i === 3 && n > 0 ? " warn" : "") }, el("div", { className: "n", textContent: nf.format(n) }), el("div", { className: "l", textContent: l }))));
    lastDaily = d.daily; drawDaily(d.daily);
    table($("dailyTable"), [["Day"], ["Opened", 1], ["Unlocks", 1], ["Visitors", 1]], d.daily.slice().reverse().map((x) => [x.day, String(x.plays), String(x.unlocks), String(x.visitors)]));
    bars($("games"), d.games, (g) => NAMES[g.game] || g.game, "plays", (g) => `${g.visitors} visitor${g.visitors === 1 ? "" : "s"}`);
    bars($("devices"), d.devices, (x) => DEVICES[x.device] || x.device, "opens");
    table($("recent"), [["When"], ["What"], ["Game"], ["Device"], ["Where"], ["Visitor"]],
      d.recent.length ? d.recent.map((r) => {
        const [label, kind] = EVENTS[r.event] || [r.event, ""];
        return [new Date(r.at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }), el("span", { className: "ev " + kind, textContent: label }),
          r.game ? NAMES[r.game] || r.game : "", DEVICES[r.device] || "", r.country || "", r.visitor || ""];
      }) : [["No activity yet", "", "", "", "", ""]]);
  }

  async function load() {
    const { status, json } = await api(`/api/admin?data=1&days=${days}`);
    if (status === 401) return show(false);
    if (!json.ok) { $("stamp").textContent = "Could not load data: " + (json.error || status); return; }
    render(json);
  }

  // ---------- wiring ----------
  $("f").addEventListener("submit", async (e) => {
    e.preventDefault(); $("go").disabled = true; $("msg").textContent = "";
    try {
      const { status } = await api("/api/admin", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: $("code").value }) });
      if (status === 200) { $("code").value = ""; return show(true); }
      $("msg").textContent = status === 401 ? "That is not the passcode." : "Something is off. Try again.";
    } catch { $("msg").textContent = "No connection. Try again."; }
    $("go").disabled = false;
  });
  $("out").addEventListener("click", async () => { await api("/api/admin", { method: "DELETE" }); show(false); $("go").disabled = false; });
  $("refresh").addEventListener("click", load);
  let rw = innerWidth; addEventListener("resize", () => { if (lastDaily && (innerWidth < 520) !== (rw < 520)) drawDaily(lastDaily); rw = innerWidth; });
  $("range").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-d]"); if (!b) return;
    days = Number(b.dataset.d);
    $("range").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    load();
  });
  api("/api/admin").then(({ json }) => show(Boolean(json.ok))).catch(() => show(false));
})();
</script>
</body>
</html>
