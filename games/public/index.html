<body>
<div class="page">
  <div class="hero" aria-hidden="true"><img src="/hero.svg" alt="" /></div>
  <main class="inner screen-in">
    <div class="brand">
      <svg class="agave" viewBox="0 0 64 48" aria-hidden="true"><path d="M32 40C31 28 29 16 32 4c3 12 1 24 0 36z"/><path d="M31 40C25 30 19 22 10 14c11 5 18 14 21 26z"/><path d="M33 40c6-10 12-18 21-26-11 5-18 14-21 26z"/><path d="M30 40C22 34 13 30 3 28c11-1 21 4 27 12z"/><path d="M34 40c8-6 17-10 27-12-11-1-21 4-27 12z"/><path d="M31 40c-3-9-6-17-12-26 7 7 11 16 12 26zM33 40c3-9 6-17 12-26-7 7-11 16-12 26z"/><path d="M8 44h48"/></svg>
      <h1 class="logo">Play</h1>
      <p class="tagline">Cards <i>\</i> Dice <i>\</i> Strategy <i>\</i> Together</p>
    </div>
    <form class="actions" id="f" autocomplete="off">
      <p class="eyebrow" style="text-align:center">Members only</p>
      <p class="lede">A small room of games for the table. Enter the passcode to come in.</p>
      <input class="field" id="code" type="password" name="code" placeholder="Passcode" aria-label="Passcode"
             autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus />
      <button class="btn" id="go" type="submit">Enter</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
  </main>
</div>
<script>
  const f = document.getElementById("f"), code = document.getElementById("code"),
        go = document.getElementById("go"), msg = document.getElementById("msg");
  const enter = () => location.replace("/play/");
  const fromPath = /^\/join\/([^/?#]+)/.exec(location.pathname);
  const join = new URLSearchParams(location.search).get("join") || (fromPath ? decodeURIComponent(fromPath[1]) : null);
  const tryCode = async (value) => {
    const r = await fetch("/api/unlock", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: value }) });
    return r.status;
  };
  fetch("/api/unlock").then(r => r.json()).then(async (j) => {
    if (j.ok) return enter();
    if (join) {
      msg.textContent = "Opening the room for you...";
      history.replaceState(null, "", "/");
      try { if (await tryCode(join) === 200) return enter(); } catch {}
      msg.textContent = "That invite link is out of date. Enter the passcode.";
    }
  }).catch(() => {});
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    go.disabled = true; msg.textContent = "";
    try {
      const status = await tryCode(code.value);
      if (status === 200) return enter();
      msg.textContent = status === 401 ? "That is not the passcode." : "Something is off. Try again.";
      code.select();
    } catch { msg.textContent = "No connection. Try again."; }
    go.disabled = false;
  });
</script>
</body>
