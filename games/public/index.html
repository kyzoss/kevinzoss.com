<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0B0B0E" />
<title>Games · Kevin Zoss</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230B0B0E'/%3E%3Crect x='6' y='20' width='20' height='4' fill='%23D80707'/%3E%3C/svg%3E" />
<style>
  :root { --bg:#0B0B0E; --ink:#FAFAF8; --soft:#C9C9CE; --red:#D80707; --hot:#FF3B2F; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
  body {
    min-height: 100svh; display: grid; place-items: center;
    padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left));
    font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: radial-gradient(ellipse at 50% 0%, rgba(255,59,47,.22), transparent 60%), var(--bg);
  }
  main { width: 100%; max-width: 420px; }
  .eyebrow { display: flex; align-items: center; gap: 12px; margin: 0 0 18px;
    font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--hot); }
  .eyebrow::before { content: ""; width: 40px; height: 3px; background: var(--red); }
  h1 { margin: 0 0 14px; font-family: "Archivo Black", "Arial Black", sans-serif; text-transform: uppercase;
    font-size: clamp(44px, 14vw, 72px); line-height: .92; letter-spacing: -.02em; }
  p { margin: 0 0 26px; color: var(--soft); line-height: 1.55; }
  form { display: flex; gap: 10px; }
  input { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink);
    background: rgba(250,250,248,.06); border: 1.5px solid rgba(250,250,248,.22); border-radius: 4px; padding: 15px 16px; }
  input:focus { outline: none; border-color: var(--hot); }
  button { font: inherit; font-size: 14px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    color: #fff; background: var(--red); border: 0; border-radius: 4px; padding: 0 22px; cursor: pointer; }
  button:hover { background: var(--hot); }
  button:disabled { opacity: .6; cursor: default; }
  #msg { min-height: 1.4em; margin-top: 14px; font-size: 14px; color: var(--hot); }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Members only</div>
  <h1>Games</h1>
  <p>A small room of one-rule games. Enter the passcode to come in.</p>
  <form id="f" autocomplete="off">
    <input id="code" type="password" name="code" placeholder="Passcode" aria-label="Passcode"
           autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus />
    <button id="go" type="submit">Enter</button>
  </form>
  <div id="msg" role="status" aria-live="polite"></div>
</main>
<script>
  const f = document.getElementById("f"), code = document.getElementById("code"),
        go = document.getElementById("go"), msg = document.getElementById("msg");
  const enter = () => location.replace("/play/");
  fetch("/api/unlock").then(r => r.json()).then(j => { if (j.ok) enter(); }).catch(() => {});
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    go.disabled = true; msg.textContent = "";
    try {
      const r = await fetch("/api/unlock", { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: code.value }) });
      if (r.ok) return enter();
      msg.textContent = r.status === 401 ? "That is not the passcode." : "Something is off. Try again.";
      code.select();
    } catch { msg.textContent = "No connection. Try again."; }
    go.disabled = false;
  });
</script>
</body>
</html>
