<!doctype html>
<html lang="en">
<head>
<base href="/play/uno/" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#F3EDE3" />
<title>Uno</title>
<link rel="preload" href="/fonts/marcellus.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <header class="top">
    <a class="back" href="/play/">&lsaquo; Games</a>
    <h1>Uno</h1>
    <div class="tally" id="tally" title="Your running record"></div>
    <button class="btn small" id="btnRules" type="button">Rules</button>
    <button class="btn small" id="btnNew" type="button">New game</button>
  </header>

  <div class="felt">
  <section class="opps" id="opps" aria-label="Opponents"></section>

  <section class="table" aria-label="Table">
    <button class="pile drawpile" id="drawPile" type="button" aria-label="Draw pile">
      <span class="back-face"><span class="back-mark">UNO</span></span>
      <span class="pile-count" id="drawCount"></span>
    </button>
    <div class="pile discard" id="discard" aria-live="off"></div>
    <div class="side">
      <div class="chip" id="colorChip"></div>
      <div class="dir" id="dirChip"></div>
    </div>
  </section>
  </div>

  <div class="turn" id="turn" role="status" aria-live="polite"></div>
  <div class="last" id="last"></div>
  <ul class="log" id="log" aria-label="Recent plays"></ul>

  <div class="actions">
    <button class="btn uno" id="btnUno" type="button">UNO!</button>
    <button class="btn" id="btnCatch" type="button">Catch</button>
    <button class="btn" id="btnPass" type="button">Keep and pass</button>
  </div>

  <section class="hand" id="hand" aria-label="Your hand"></section>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <div class="mbody" id="mBody"></div>
    <div class="mbtns" id="mBtns"></div>
  </div>
</div>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
