<!doctype html>
<html lang="en">
<head>
<base href="/play/cribbage/" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#F3EDE3" />
<title>Cribbage</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="app" id="app">
  <header class="top">
    <a class="back" href="/play/">&lsaquo; Games</a>
    <h1>Cribbage</h1>
    <div class="tools">
      <span class="tally" id="tally" title="Your wins and losses">0-0</span>
      <button class="btn small" id="btn-rules" type="button">Rules</button>
      <button class="btn small" id="btn-menu" type="button">Menu</button>
    </div>
  </header>

  <div class="cols">
  <div class="col-l">
  <section class="boardwrap" aria-label="Cribbage board">
    <div class="scores" id="scores"></div>
    <svg class="board" id="board" viewBox="0 0 400 134" role="img" aria-label="Cribbage board with pegs"></svg>
  </section>

  <section class="logbox" aria-label="Game log">
    <h2>Log</h2>
    <ol id="log"></ol>
  </section>
  </div>
  <div class="col-r">
  <section class="status" id="status" aria-live="polite"></section>

  <section class="table" id="table" aria-label="Table"></section>

  <section class="panel" id="panel"></section>

  <section class="me" aria-label="Your hand">
    <div class="hand" id="hand"></div>
  </section>
  </div>
  </div>
</main>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="sheet" id="sheet"></div>
</div>

<noscript><p style="padding:16px">Cribbage needs JavaScript.</p></noscript>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
