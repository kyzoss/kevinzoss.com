<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<base href="/play/dominoes/" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#F3EDE3" />
<title>Dominoes</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="dIvory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFEF8" /><stop offset="0.55" stop-color="#F5EEDD" /><stop offset="1" stop-color="#E4D9C0" />
    </linearGradient>
    <linearGradient id="dBevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95" /><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.12" /><stop offset="1" stop-color="#7E7259" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="dEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFC3A8" /><stop offset="1" stop-color="#9E917A" />
    </linearGradient>
    <radialGradient id="dPip" cx="0.38" cy="0.34" r="0.78">
      <stop offset="0" stop-color="#5A5049" /><stop offset="0.55" stop-color="#231D19" /><stop offset="1" stop-color="#0A0807" />
    </radialGradient>
    <radialGradient id="dBrass" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#F6E3A6" /><stop offset="0.6" stop-color="#C4952E" /><stop offset="1" stop-color="#7A5A14" />
    </radialGradient>
    <radialGradient id="dFelt" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#47704F" /><stop offset="0.7" stop-color="#3A5C42" /><stop offset="1" stop-color="#2E4A36" />
    </radialGradient>
    <filter id="dShadow" x="-40%" y="-40%" width="180%" height="200%">
      <feGaussianBlur stdDeviation="1.3" />
    </filter>
    <filter id="dGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" />
    </filter>
  </defs>
</svg>

<main class="app" id="app">
  <header class="top">
    <a class="back" href="/play/">&lsaquo; Games</a>
    <h1>Dominoes</h1>
    <div class="tools">
      <button class="btn small" id="btn-rules" type="button">Rules</button>
      <button class="btn small" id="btn-menu" type="button">Menu</button>
    </div>
  </header>

  <section class="strip" id="strip" aria-label="Scores"></section>
  <div class="status" id="status" aria-live="polite"></div>

  <section class="table" id="table" aria-label="Table">
    <svg id="board" class="board" xmlns="http://www.w3.org/2000/svg" viewBox="-100 -60 200 120" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Line of play"></svg>
    <div class="chips" id="chips"></div>
    <div class="yard" id="yard"></div>
  </section>

  <section class="panel" id="panel" aria-live="polite"></section>

  <section class="me" id="me" aria-label="Your hand">
    <div class="me-label" id="meLabel"></div>
    <div class="hand" id="hand"></div>
  </section>
</main>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="sheet" id="sheet"></div>
</div>

<div class="handoff" id="handoff" hidden role="dialog" aria-modal="true" aria-labelledby="handoff-title">
  <div class="handoff-card" id="handoffCard"></div>
</div>

<noscript><p style="padding:16px">Dominoes needs JavaScript.</p></noscript>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
