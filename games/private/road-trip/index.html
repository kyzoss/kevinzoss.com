<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<base href="/play/road-trip/" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#F3EDE3" />
<title>Road Trip</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main id="app">

  <section id="menu" class="screen">
    <a class="back" href="/play/">&larr; back to games</a>
    <div class="hero card">
      <div id="heroCar" class="herocar" aria-hidden="true"></div>
      <div class="herotxt">
        <h1>Road Trip</h1>
        <p class="lede">Ten games for the back seat. Look out the window, talk and laugh, or just keep busy.</p>
      </div>
    </div>

    <div class="card setup">
      <div class="setuprow">
        <h2>Who is playing?</h2>
        <div class="seg" role="group" aria-label="Age level">
          <button class="segbtn" data-age="little" aria-pressed="false" type="button"><b>Little</b><span>ages 5 to 7</span></button>
          <button class="segbtn" data-age="big" aria-pressed="false" type="button"><b>Big</b><span>ages 8 to 10</span></button>
        </div>
      </div>
      <div class="roster" id="roster"></div>
    </div>

    <div id="groups"></div>
  </section>

  <section id="game" class="screen" hidden>
    <header class="top">
      <button class="back btn ghost" id="toMenu" type="button" aria-label="Back to the game menu">&larr; Menu</button>
      <h1 class="small" id="gameTitle">Game</h1>
      <div class="topright" id="topRight"></div>
    </header>
    <div id="live" class="sr" aria-live="polite"></div>
    <div id="gameBody"></div>
  </section>

</main>

<div class="confetti" id="confetti" aria-hidden="true"></div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="sheet card">
    <h2 id="modalTitle">Players</h2>
    <div id="modalBody"></div>
    <div class="row end"><button class="btn" id="modalClose" type="button">Done</button></div>
  </div>
</div>

<noscript><p style="padding:16px">Road Trip needs JavaScript.</p></noscript>
<script src="content.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
