<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<base href="/play/backgammon/" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#F3EDE3" />
<title>Backgammon</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main id="app">

  <section id="menu" class="screen">
    <a class="back" href="/play/">&larr; back to games</a>
    <h1>Backgammon</h1>
    <p class="lede">Race your fifteen checkers home. Dice decide the moves, you decide the plan.</p>

    <button id="resume" class="btn primary" hidden></button>

    <div class="card">
      <h2>New game</h2>
      <div class="row">
        <span class="lab">Opponent</span>
        <div class="seg" id="modeSeg" role="group" aria-label="Opponent">
          <button data-mode="cpu" class="on">Computer</button><button data-mode="2p">Two humans</button>
        </div>
      </div>
      <p class="hint" id="modeHint">You play the cream checkers against the computer.</p>
      <label class="check"><input type="checkbox" id="cubeChk" /> <span>Doubling cube</span></label>
      <div class="row">
        <span class="lab">Match length</span>
        <select id="matchSel" aria-label="Match length">
          <option value="0">Single game</option>
          <option value="3">To 3 points</option>
          <option value="5">To 5 points</option>
          <option value="7">To 7 points</option>
          <option value="9">To 9 points</option>
          <option value="11">To 11 points</option>
        </select>
      </div>
      <label class="check" id="crawRow"><input type="checkbox" id="crawChk" checked /> <span>Crawford rule (matches with the cube)</span></label>
      <button id="startBtn" class="btn primary">Start game</button>
    </div>

    <div class="card" id="tallyCard">
      <h2>Your record</h2>
      <div id="tally" class="tally"></div>
      <button id="resetTally" class="linkbtn">Reset record</button>
    </div>

    <div class="rules-slot"></div>
  </section>

  <section id="game" class="screen" hidden>
    <div class="top">
      <a class="back" href="/play/">&larr; games</a>
      <h1 class="small">Backgammon</h1>
      <button id="menuBtn" class="linkbtn">New game</button>
    </div>

    <div class="layout">
      <div class="play">
        <div id="score" class="score" aria-live="polite"></div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div id="boardWrap" class="boardwrap">
          <svg id="board" viewBox="0 0 400 608" role="img" aria-label="Backgammon board"></svg>
        </div>
        <div class="controls">
          <div id="dice" class="dice" aria-label="Dice"></div>
          <div class="btns">
            <button id="mainBtn" class="btn primary">Roll dice</button>
            <div class="btns2">
              <button id="undoBtn" class="btn">Undo</button>
              <button id="dblBtn" class="btn" hidden>Double</button>
            </div>
          </div>
        </div>
      </div>
      <div class="side">
        <div class="card">
          <h2>Move log</h2>
          <ol id="log" class="log"></ol>
        </div>
        <div class="rules-slot"></div>
        <p id="seedNote" class="hint seednote"></p>
      </div>
    </div>
  </section>

</main>

<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div id="modalBtns" class="modal-btns"></div>
  </div>
</div>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
