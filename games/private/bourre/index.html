<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<base href="/play/bourre/" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#F3EDE3" />
<title>Bourre</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <a class="back" href="/play/">&lsaquo; Games</a>
    <h1>Bourre</h1>
    <div class="tools">
      <button class="btn small" id="btn-rules" type="button">Rules</button>
      <button class="btn small" id="btn-menu" type="button">Menu</button>
    </div>
  </header>

  <section class="strip" id="strip" aria-label="Chips"></section>
  <section class="seats" id="seats" aria-label="Opponents"></section>

  <section class="mid" aria-label="Pot and trump">
    <div class="pot" id="pot"></div>
    <div class="trumpbox" id="trumpbox"></div>
  </section>

  <section class="trick" id="trick" aria-label="Current trick"></section>

  <section class="panel" id="panel" aria-live="polite"></section>

  <section class="me" aria-label="Your hand">
    <div class="me-label" id="me-label"></div>
    <div class="hand" id="hand"></div>
  </section>

  <details class="logbox" id="logbox">
    <summary>Game log</summary>
    <ol id="log"></ol>
  </details>
  <p class="fine">Play money only. No real money.</p>
</main>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="sheet" id="sheet"></div>
</div>

<noscript><p style="padding:16px">Bourre needs JavaScript.</p></noscript>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
