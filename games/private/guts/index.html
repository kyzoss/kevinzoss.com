<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<base href="/play/guts/" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#F3EDE3" />
<title>Guts</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <header class="top">
    <a class="back" href="/play/">&larr; Games</a>
    <h1>Guts</h1>
    <div class="tally" id="tally" title="Your record this browser"></div>
    <button class="btn small" id="btnRules" type="button">How to play</button>
    <button class="btn small" id="btnNew" type="button">New game</button>
  </header>

  <section class="opps" id="opps" aria-label="Opponents"></section>

  <section class="potbox" aria-label="Pot">
    <div class="chipsvg" id="potChips" aria-hidden="true"></div>
    <div class="potinfo">
      <div class="potlabel">Pot</div>
      <div class="potnum" id="potNum">0</div>
      <div class="potsub" id="potSub"></div>
    </div>
  </section>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <section class="me" id="me" aria-label="Your seat"></section>

  <div class="actions" id="actions"></div>

  <ul class="log" id="log" aria-label="Hand results"></ul>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <div class="mbody" id="mBody"></div>
    <div class="mbtns" id="mBtns"></div>
  </div>
</div>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
