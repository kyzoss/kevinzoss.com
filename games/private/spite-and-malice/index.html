<!doctype html>
<html lang="en">
<head>
<base href="/play/spite-and-malice/" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0B0B0E" />
<title>Spite and Malice</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <header class="top">
    <a class="back" href="/play/">&lsaquo; Games</a>
    <h1>Spite &amp; Malice</h1>
    <div class="tools">
      <button id="btnHelp" type="button" class="tbtn">Rules</button>
      <button id="btnNew" type="button" class="tbtn">New</button>
    </div>
  </header>

  <div class="layout">
    <main class="board" id="board" aria-label="Game board"></main>
    <aside class="side">
      <div class="tally" id="tally"></div>
      <h2>Moves</h2>
      <ol class="log" id="log" aria-live="polite"></ol>
    </aside>
  </div>
</div>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true">
  <div class="sheet" id="sheet"></div>
</div>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
