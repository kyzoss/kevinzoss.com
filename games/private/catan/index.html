<!doctype html>
<html lang="en">
<head>
<base href="/play/catan/" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#F3EDE3" />
<title>Settlers of Catan</title>
<link rel="preload" href="/fonts/marcellus.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <a class="back" href="/play/">&lsaquo; Back to games</a>
    <h1>Settlers of Catan</h1>
    <div class="topbtns">
      <button type="button" class="ghost" id="btnLog">Log</button>
      <button type="button" class="ghost" id="btnRules">Rules</button>
      <button type="button" class="ghost" id="btnMenu">Menu</button>
    </div>
  </header>

  <section class="boardwrap" id="boardwrap">
    <canvas id="board" aria-label="Game board. Tap highlighted spots to place pieces."></canvas>
    <div class="banner" id="banner" role="status" aria-live="polite"></div>
    <div class="zoom">
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" id="zout" aria-label="Zoom out">&minus;</button>
      <button type="button" id="zfit" aria-label="Fit board">Fit</button>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </section>

  <section class="players" id="players" aria-label="Players"></section>
  <section class="status" id="status" aria-live="polite"></section>
  <section class="hand" id="hand" aria-label="Your hand"></section>
  <section class="actions" id="actions" aria-label="Actions"></section>
  <section class="logpanel" id="logpanel" aria-label="Action log"><h2>Action log</h2><ol id="log"></ol></section>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" id="sheet"><div id="modalBody"></div></div>
</div>

<noscript><p style="padding:16px;color:#2B2622">This game needs JavaScript.</p></noscript>
<script src="logic.js"></script>
<script src="art.js"></script>
<script src="app.js"></script>
</body>
</html>
