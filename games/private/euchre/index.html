<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0B0B0E" />
<meta name="color-scheme" content="dark" />
<title>Euchre</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="s-S" viewBox="0 0 24 24"><path d="M12 1.5C12 1.5 3 8.4 3 14.2c0 2.9 2.2 4.6 4.5 4.6 1.5 0 2.8-.7 3.6-1.8-.1 2.6-.9 4.1-3.1 5.5h8c-2.2-1.4-3-2.9-3.1-5.5.8 1.1 2.1 1.8 3.6 1.8 2.3 0 4.5-1.7 4.5-4.6C21 8.4 12 1.5 12 1.5z"/></symbol>
  <symbol id="s-H" viewBox="0 0 24 24"><path d="M12 22C5 16.6 2 12.8 2 8.8 2 5.7 4.4 3.4 7.2 3.4c2 0 3.9 1.1 4.8 3 .9-1.9 2.8-3 4.8-3C19.6 3.4 22 5.7 22 8.8c0 4-3 7.8-10 13.2z"/></symbol>
  <symbol id="s-D" viewBox="0 0 24 24"><path d="M12 1 20.5 12 12 23 3.5 12z"/></symbol>
  <symbol id="s-C" viewBox="0 0 24 24"><path d="M12 1.8a4.5 4.5 0 0 0-3.4 7.5A4.8 4.8 0 1 0 10.8 17c-.1 2.4-.9 3.9-3.1 5.2h8.6c-2.2-1.3-3-2.8-3.1-5.2a4.8 4.8 0 1 0 2.2-7.7A4.5 4.5 0 0 0 12 1.8z"/></symbol>
</svg>

<main class="app" id="app">
  <header class="top">
    <a class="back" href="/play/">&lsaquo; Games</a>
    <h1>EUCHRE</h1>
    <div class="tools">
      <span class="tally" id="tally" title="Your wins and losses">0-0</span>
      <button class="btn small" id="btn-rules" type="button">Rules</button>
      <button class="btn small" id="btn-menu" type="button">Menu</button>
    </div>
  </header>

  <section class="score" id="score" aria-label="Score"></section>

  <section class="table" id="table" aria-label="Table">
    <div class="seat s-n" id="seat-2"></div>
    <div class="seat s-w" id="seat-1"></div>
    <div class="center" id="center"></div>
    <div class="seat s-e" id="seat-3"></div>
  </section>

  <section class="panel" id="panel" aria-live="polite"></section>

  <section class="me" id="me" aria-label="Your hand">
    <div class="me-label" id="me-label"></div>
    <div class="hand" id="hand"></div>
  </section>
</main>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="sheet" id="sheet"></div>
</div>

<noscript><p style="padding:16px">Euchre needs JavaScript.</p></noscript>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
