  <noscript><p style="padding:24px;font-family:system-ui,sans-serif">Pick'em needs JavaScript.</p></noscript>
  <!-- One origin for the whole pool. A browser and a Home Screen app on the same
       device get separate storage per origin, so being reachable at both
       kevinzoss.com/nfl/ and nfl.kevinzoss.com meant two boards that never
       agreed.

       But it only moves you once it has PROVED the other host serves this exact
       build. Jumping to a host whose deploy is stale, or that 404s, is worse
       than two origins -- and that is precisely what happened here, so the
       check is the point. Fails closed: any doubt and you stay where you are,
       which still works. -->
  <script>
    (function () {
      var CANON = "nfl.kevinzoss.com";
      var h = location.hostname;
      if (!h || h === CANON) return;
      if (location.protocol !== "https:") return;
      if (/^(localhost|127\.|0\.0\.0\.0|\[?::1)/.test(h) || h.endsWith(".local")) return;

      var mine = null;
      var candidates = ["https://" + CANON + "/", "https://" + CANON + location.pathname];
      var ask = function (base) {
        return fetch(new URL("version.json", base).href, { cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) { return d && d.v === mine ? base : null; })
          .catch(function () { return null; });
      };
      fetch(new URL("version.json", location.href).href, { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          mine = d && d.v;
          if (!mine) return null;
          return ask(candidates[0]).then(function (hit) { return hit || ask(candidates[1]); });
        })
        .then(function (base) { if (base) location.replace(base + location.search + location.hash); })
        .catch(function () { /* stay put: this origin works */ });
    })();
  </script>
  <!-- A module that throws at import time renders nothing at all, and a black
       screen says nothing about why. This paints the failure where it happened
       instead. Inline and first, so it is running before anything can break. -->
  <script>
    (function () {
      var shown = false;
      function show(what, detail) {
        if (shown) return; shown = true;
        var app = document.getElementById("app") || document.body;
        if (app.innerHTML.replace(/\s/g, "").length > 40) return;  // it rendered; not a blank screen
        app.innerHTML =
          '<div style="max-width:34rem;margin:12vh auto;padding:0 20px;font:14px/1.6 ui-sans-serif,system-ui,sans-serif;color:#F4F4F2">' +
          '<h1 style="font-size:19px;margin:0 0 10px">The app could not start</h1>' +
          '<p style="color:#A7A9AC;margin:0 0 14px">Send this to Kevin. It says exactly what broke.</p>' +
          '<pre style="white-space:pre-wrap;word-break:break-word;background:#141418;border:1px solid #2B2B33;' +
          'border-radius:10px;padding:12px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#FF8A6B;margin:0 0 14px">' +
          (what + ": " + detail).replace(/[<>&]/g, "") + "\n\nbuild " + (window.__BUILD__ || "unknown") +
          "\n" + location.href + '</pre>' +
          '<p style="margin:0"><a href="?fresh=' + Date.now() + '" style="color:#FF3C00">Reload, ignoring the cache</a></p>' +
          '</div>';
      }
      addEventListener("error", function (e) {
        if (e.target && e.target.tagName === "SCRIPT") return show("Could not load", e.target.src || "a script");
        show("Error", (e.message || "unknown") + (e.filename ? " (" + e.filename.split("/").pop() + ")" : ""));
      }, true);
      addEventListener("unhandledrejection", function (e) {
        show("Failed", (e.reason && (e.reason.message || e.reason)) || "unknown");
      });
      // If nothing has rendered a few seconds in, something silent went wrong.
      setTimeout(function () { show("Nothing rendered", "the app loaded but drew nothing"); }, 6000);
    })();
  </script>

  <script type="module" src="./js/app.js?v=fa2d7d7b"></script>
