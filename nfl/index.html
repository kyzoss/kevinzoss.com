<body>
  <div id="app" aria-live="polite"></div>
  <noscript><p style="padding:24px;font-family:system-ui,sans-serif">Pick'em needs JavaScript.</p></noscript>
  <!-- One origin for the whole pool. A browser and a Home Screen app on the same
       device get separate storage per origin, so being reachable at both
       kevinzoss.com/nfl/ and nfl.kevinzoss.com meant two boards that never
       agreed. Anything but the canonical host is sent there before app code
       runs; localhost and file:// are left alone so development still works. -->
  <script>
    (function () {
      var CANON = "nfl.kevinzoss.com";
      var h = location.hostname;
      if (!h || h === CANON) return;
      if (location.protocol !== "https:" && location.protocol !== "http:") return;
      if (/^(localhost|127\.|0\.0\.0\.0|\[?::1)/.test(h) || h.endsWith(".local")) return;
      location.replace("https://" + CANON + "/" + location.search + location.hash);
    })();
  </script>
  <script src="./config.js?v=7c6be0ca"></script>
  <script type="module" src="./js/app.js?v=7c6be0ca"></script>
</body>
