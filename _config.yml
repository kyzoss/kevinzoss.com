# GitHub Pages publishes everything in the repo by default. These are build
# tooling, not content, and have no reason to be fetchable from the web root.
exclude:
  - build-frames.py
  - stamp.py
  - .gstack

# Jekyll skips dot-directories by default, which silently dropped
# /.well-known/security.txt (the path RFC 9116 specifies).
include:
  - .well-known
